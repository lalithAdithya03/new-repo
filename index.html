<!doctype html>
<html lang="en" data-theme="midnight-indigo" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Macro AI: Knowledge Without Boundaries. AI-powered personalized learning." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Macro AI · Knowledge Without Boundaries</title>
    <script>
      // Apply the saved theme before first paint so there is no flash of the default theme.
      try {
        var t = JSON.parse(localStorage.getItem('macro.theme') || 'null');
        if (t && t.theme && t.mode) { document.documentElement.dataset.theme = t.theme; document.documentElement.dataset.mode = t.mode; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
